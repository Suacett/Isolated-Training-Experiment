version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: proxmox_stock_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: stock_predictor
    ports:
      - "5432:5432" # Exposed for host-based training scripts
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: proxmox_stock_backend
    # privileged: true # Removed for security.
    # runtime: nvidia # For Docker Compose V1/V2 legacy compatibility - REMOVED (Invalid)
    environment:
      - ALPHA_VANTAGE_KEY=${ALPHA_VANTAGE_KEY}
      - ALPHA_VANTAGE_KEYS=${ALPHA_VANTAGE_KEYS:-}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/stock_predictor
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./legacy:/app/legacy
    depends_on:
      - db
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: proxmox_stock_frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://stonk-data.tylenol.horse
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      - backend

volumes:
  db_data:
